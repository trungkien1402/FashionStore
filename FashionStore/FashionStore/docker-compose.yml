services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fashionstore-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql

  web:
    build:
      context: ./FashionStore
    container_name: fashionstore-web
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=database,1433;Database=FashionStoreDB;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True"
    depends_on:
      - database

volumes:
  sql_data: