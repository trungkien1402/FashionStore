services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fashionstore-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env before starting}"
    networks:
      - database_private
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - 'SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q "SELECT 1" -b -o /dev/null'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: .
    container_name: fashionstore-web
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    networks:
      - web_public
      - database_private
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=database,1433;Database=${DB_NAME:-FashionStoreDB};User Id=sa;Password=${DB_PASSWORD:?Set DB_PASSWORD in .env before starting};Encrypt=True;TrustServerCertificate=True"
    depends_on:
      database:
        condition: service_healthy

networks:
  web_public:
    driver: bridge
    ipam:
      config:
        - subnet: "${WEB_SUBNET:-172.30.10.0/24}"
  database_private:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: "${DB_SUBNET:-172.30.20.0/24}"

volumes:
  sql_data:
