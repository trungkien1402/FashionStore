name: CI/CD Pipeline - FashionStore Build & Verify

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Build & Code Verification
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup .NET SDK (10.0.x Preview / RC)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: 📦 Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: 🔄 Restore NuGet Dependencies
        run: dotnet restore FashionStore/FashionStore.csproj

      - name: 🔨 Build Project (Release Mode)
        run: dotnet build FashionStore/FashionStore.csproj --configuration Release --no-restore

      - name: 🧪 Run Automated Tests (if present)
        run: |
          dotnet test --no-build --configuration Release --verbosity normal || echo "No test projects detected, skipping."

      - name: 🚀 Publish Verification (Smoke Test)
        run: dotnet publish FashionStore/FashionStore.csproj --configuration Release --no-build -o ./app-publish
